<style>
@font-face{font-family:"Vazirmatn";src:url(fonts/Vazirmatn-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url(fonts/Vazirmatn-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url(fonts/Vazirmatn-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url(fonts/Vazirmatn-Black.woff2) format("woff2");font-weight:800;font-display:swap}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: a CEFR staircase picks the level; lesson list on the side, lesson + practice in the main column (RTL). */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#151C2E; --muted:#5A6377; --line:#DCE1EB; --soft:#EBEEF5;
  --a1:#2A8352; --a2:#0E7F84; --b1:#2D63C8; --b2:#7446C2; --c1:#B93A64; --c2:#8C6410;
  --ok:#1E8A4B; --ok-bg:#E3F4EA; --bad:#C0392B; --bad-bg:#FBE7E4; --tip-bg:#FFF6DD; --tip-line:#E3B341;
  --fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --en:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --lv:var(--a1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#171C2B; --ink:#E7EAF2; --muted:#9AA3B7; --line:#2A3146; --soft:#1F2537;
  --a1:#4FBF7F; --a2:#3CBFC3; --b1:#6D9BF2; --b2:#A884F0; --c1:#EC7BA0; --c2:#E0B24C;
  --ok:#5BD08C; --ok-bg:#16301F; --bad:#F07A6C; --bad-bg:#3A1C1A; --tip-bg:#2E2814; --tip-line:#C99A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171C2B; --ink:#E7EAF2; --muted:#9AA3B7; --line:#2A3146; --soft:#1F2537;
  --a1:#4FBF7F; --a2:#3CBFC3; --b1:#6D9BF2; --b2:#A884F0; --c1:#EC7BA0; --c2:#E0B24C;
  --ok:#5BD08C; --ok-bg:#16301F; --bad:#F07A6C; --bad-bg:#3A1C1A; --tip-bg:#2E2814; --tip-line:#C99A2E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fa);font-size:16px;line-height:1.85;direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.en,bdi.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:46ch}
.modes{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.modes button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:9px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
/* staircase */
.stairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;margin:8px 0 24px;direction:ltr}
.step{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px 12px 6px 6px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:10px 12px;text-align:left;min-width:0}
.step:nth-child(1){height:74px}.step:nth-child(2){height:90px}.step:nth-child(3){height:106px}.step:nth-child(4){height:122px}.step:nth-child(5){height:138px}.step:nth-child(6){height:154px}
@media (max-width:560px){.stairs{gap:5px}.step{padding:8px 7px}.step b{font-size:1rem}.step small{font-size:.66rem}}
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.btn[aria-pressed="true"]{border-color:var(--lv);color:var(--lv)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vh{display:flex;gap:10px;align-items:center;justify-content:space-between;direction:ltr}
.vw{font-family:var(--en);font-size:1.12rem;font-weight:600;color:var(--lv);min-width:0}
.vm{font:inherit;font-weight:700;text-align:right;background:none;border:0;padding:0;color:var(--ink);cursor:default;transition:filter .2s}
.hidemean .vm:not(.show){filter:blur(6px);cursor:pointer;user-select:none}
.vx{font-family:var(--en);direction:ltr;text-align:left;color:var(--muted);font-size:.93rem;font-style:italic;line-height:1.55}
.hidemean .ex .f:not(.show){filter:blur(6px);cursor:pointer;user-select:none}
.exs.hidemean .ex .f{cursor:pointer}
.pscore{margin-top:14px;color:var(--muted)}.pscore b{color:var(--ink)}
.list h2.sep{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.list .dot.cnt{width:auto;min-width:24px;border-radius:10px;padding:0 4px;color:var(--muted);font-size:.68rem;border-color:var(--line)}
.opts.fa{direction:rtl}.opts.fa button{font-family:var(--fa);font-size:.95rem}
.picks.types{direction:rtl;justify-content:flex-start;margin-top:-6px}.picks.types label{font-family:var(--fa)}
.step .fill{position:absolute;inset:auto 0 0 0;background:var(--c);opacity:.16;transition:height .4s}
.step b{font-family:var(--mono);font-size:1.15rem;color:var(--c);position:relative}
.step small{font-family:var(--fa);direction:rtl;color:var(--muted);font-size:.75rem;position:relative;line-height:1.4}
.step[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.step:focus-visible,button:focus-visible{outline:2.5px solid var(--lv);outline-offset:2px}
.overall{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;width:140px}
.bar i{display:block;height:100%;background:var(--ink);opacity:.7;transition:width .4s}
/* main grid */
.grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
aside.list{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:860px){aside.list{position:static;max-height:none}}
.list h2{font-size:.8rem;letter-spacing:.04em;color:var(--muted);margin:2px 6px 8px;font-weight:700}
.list ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.list ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.list button{font:inherit;font-size:.92rem;width:100%;text-align:right;border:0;background:transparent;color:var(--ink);padding:7px 10px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;line-height:1.5}
.list button:hover{background:var(--soft)}
.list button[aria-current="true"]{background:var(--soft);font-weight:700;box-shadow:inset -3px 0 0 var(--lv)}
.list .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:#fff}
.list .dot.done{background:var(--lv);border-color:var(--lv)}
/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3.5vw,36px);min-width:0}
.eyebrow{display:flex;gap:10px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.lvtag{font-family:var(--mono);color:#fff;background:var(--lv);border-radius:6px;padding:1px 8px;font-size:.8rem;direction:ltr}
.lesson h2{font-size:clamp(1.4rem,3.4vw,1.9rem);font-weight:800;margin:0;line-height:1.4;text-wrap:balance}
.lesson .entitle{font-family:var(--en);font-style:italic;color:var(--muted);direction:ltr;text-align:right;margin:2px 0 14px}
.lesson h3{font-size:1.05rem;margin:28px 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.lesson h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--lv)}
.lesson p{margin:0 0 10px;max-width:68ch}
.formula{border:1.5px dashed var(--lv);border-radius:12px;padding:6px 0;overflow-x:auto;background:color-mix(in srgb,var(--lv) 6%,var(--surface))}
.formula table{border-collapse:collapse;width:100%}
.formula td{padding:7px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
.formula tr:last-child td{border-bottom:0}
.formula td:first-child{color:var(--muted);font-size:.85rem;white-space:nowrap;width:1%}
.formula td:last-child{font-family:var(--mono);font-size:.9rem;direction:ltr;text-align:left;white-space:pre-wrap}
ul.uses{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.exs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--soft)}
.ex .s{flex:1;min-width:0}
.ex .e{font-family:var(--en);font-size:1.07rem;direction:ltr;text-align:left;line-height:1.6}
.ex .f{color:var(--muted);font-size:.88rem}
.say{flex:none;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--lv);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.say svg{width:15px;height:15px;fill:currentColor}
.tip{border-inline-start:4px solid var(--tip-line);background:var(--tip-bg);border-radius:8px;padding:10px 14px;margin-top:22px}
.tip b{display:block;margin-bottom:2px}
.qs{display:flex;flex-direction:column;gap:14px;counter-reset:q}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.q .qt{font-family:var(--en);font-size:1.05rem;direction:ltr;text-align:left;margin-bottom:10px;unicode-bidi:plaintext}
.opts{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.opts button{font-family:var(--en);font-size:1rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;border-radius:9px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--lv)}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opts button:disabled{cursor:default}
.why{margin-top:10px;font-size:.92rem;padding:8px 12px;border-radius:8px}
.why.ok{background:var(--ok-bg)}.why.bad{background:var(--bad-bg)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--lv);border-color:var(--lv);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;gap:8px}
/* quiz mode */
.quizbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3.5vw,36px);max-width:760px;margin:0 auto}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px;direction:ltr;justify-content:flex-end}
.picks label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:4px 12px;cursor:pointer;font-family:var(--mono)}
.qprog{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.score{font-size:3rem;font-weight:800;font-family:var(--mono);direction:ltr;text-align:right}
.miss{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.miss li{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.link{font:inherit;color:var(--b1);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="top">

      <h1>نردبان گرامر انگلیسی</h1>
      <p class="sub">۵۴ درس گرامر از A1 تا C2 با توضیح ساده، فرمول، مثال صوتی و تمرین، به‌علاوه‌ی کلمات مهم، collocationها، idiomها و جمله‌های کاربردی هر سطح در موقعیت‌هایی مثل خرید، سفر، اداره و سر کار.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">

      <div class="overall"><span id="ovText"></span><div class="bar"><i id="ovBar"></i></div></div>

  <main id="main"></main>
</div>

<script>
const LV={a1:{n:"مبتدی",c:"--a1"},a2:{n:"پایه",c:"--a2"},b1:{n:"متوسط",c:"--b1"},b2:{n:"بالاتر از متوسط",c:"--b2"},c1:{n:"پیشرفته",c:"--c1"},c2:{n:"تسلط کامل",c:"--c2"}};
const T=[
/* ================= A1 ================= */
{lv:"a1",id:"be",en:"The verb to be",fa:"فعل to be (بودن)",
i:"to be همان «هستم / هستی / است» فارسی است. سه شکل در زمان حال دارد: am و is و are. در فارسی گاهی «است» را حذف می‌کنیم ولی در انگلیسی هیچ‌وقت نباید حذف شود.",
f:[["مثبت","I am · he/she/it is · you/we/they are"],["منفی","I am not · he isn't · they aren't"],["سؤالی","Am I…? · Is she…? · Are you…?"],["مخفف","I'm · you're · he's · it's · we're"]],
u:["معرفی و شغل: I am a student.","حال و احوال و صفت: She is tired.","مکان: They are at home.","سن (با be، نه have): I am 20 years old."],
x:[["I am a student at university.","من دانشجوی دانشگاه هستم."],["She is at home now.","او الان خانه است."],["They aren't tired.","آن‌ها خسته نیستند."],["Are you ready?","آماده‌ای؟"],["I'm twenty years old.","بیست سالمه."]],
t:"❌ She happy. ✅ She is happy. — ❌ I have 20 years. ✅ I am 20 years old.",
q:[["My parents ___ teachers.",["is","are","am"],1,"فاعل جمع (parents) است، پس are."],["___ he your brother?",["Are","Is","Am"],1,"برای he/she/it از is استفاده می‌کنیم."],["I ___ hungry.",["am","is","are"],0,"I همیشه با am می‌آید."]]},

{lv:"a1",id:"pron",en:"Pronouns & possessives",fa:"ضمیرها و صفت‌های ملکی",
i:"ضمیر به جای اسم می‌نشیند. چهار گروه داریم: ضمیر فاعلی (قبل از فعل)، ضمیر مفعولی (بعد از فعل یا حرف اضافه)، صفت ملکی (قبل از اسم) و ضمیر ملکی (تنها، بدون اسم).",
f:[["فاعلی","I · you · he · she · it · we · they"],["مفعولی","me · you · him · her · it · us · them"],["صفت ملکی","my · your · his · her · its · our · their  + اسم"],["ضمیر ملکی","mine · yours · his · hers · ours · theirs"]],
u:["فاعل: **She** likes tea.","مفعول: I know **her**.","مالکیت + اسم: This is **my** book.","مالکیت بدون اسم: This book is **mine**."],
x:[["He loves her, and she loves him.","او (مرد) او را دوست دارد و او (زن) هم او را."],["Is this your phone? — No, it's hers.","این گوشی توئه؟ — نه، مال اوست."],["The cat is eating its food.","گربه دارد غذایش را می‌خورد."],["Tell us about your family.","درباره‌ی خانواده‌ات به ما بگو."]],
t:"its (مال آن) با it's (= it is) فرق دارد. ❌ The dog wagged it's tail. ✅ its tail.",
q:[["This book is ___. (مال من)",["my","mine","me"],1,"بعدش اسمی نیامده، پس ضمیر ملکی mine."],["Call ___ tomorrow. (به او ـ مرد)",["he","his","him"],2,"بعد از فعل، ضمیر مفعولی him."],["The dog wagged ___ tail.",["it's","its","it"],1,"its یعنی «مال آن». it's یعنی it is."]]},

{lv:"a1",id:"ps",en:"Present simple",fa:"حال ساده",
i:"برای کارهایی که عادت یا روتین ما هستند و برای حقیقت‌های همیشگی. نکته‌ی طلایی: برای he / she / it به فعل s اضافه می‌کنیم. در منفی و سؤالی از do / does کمک می‌گیریم و فعل اصلی ساده می‌شود.",
f:[["مثبت","I/you/we/they work · he/she/it works"],["منفی","I don't work · she doesn't work"],["سؤالی","Do you work? · Does he work?"],["املای s","watch→watches · go→goes · study→studies · play→plays"]],
u:["عادت و روتین: I drink tea every morning.","حقیقت علمی: Water boils at 100°C.","برنامه‌ی ثابت: The train leaves at 8.","کلمات نشانه: always, usually, every day, on Mondays"],
x:[["She goes to work by bus.","او با اتوبوس سر کار می‌رود."],["I don't eat meat.","من گوشت نمی‌خورم."],["Does your brother live in Tehran?","برادرت تهران زندگی می‌کند؟"],["The sun rises in the east.","خورشید از شرق طلوع می‌کند."]],
t:"وقتی does آمد، s فعل اصلی حذف می‌شود. ❌ Does she likes…? ✅ Does she like…?",
q:[["She ___ to work by bus.",["go","goes","going"],1,"فاعل she است، پس goes."],["___ they live here?",["Does","Do","Are"],1,"they با do می‌آید."],["He doesn't ___ coffee.",["likes","like","liking"],1,"بعد از doesn't فعل ساده می‌آید."]]},

{lv:"a1",id:"pc",en:"Present continuous",fa:"حال استمراری",
i:"برای کاری که همین الان در حال انجام است یا یک وضعیت موقت. ساختارش am/is/are + فعل ing‌دار است.",

x:[["I saw him last week.","هفته‌ی پیش دیدمش."],["I've known her since 2019.","از ۲۰۱۹ می‌شناسمش."],["She has worked here for three years.","سه سال است اینجا کار می‌کند."],["When did you arrive?","کی رسیدی؟"]],
t:"در فارسی می‌گوییم «سه سال است اینجا زندگی می‌کنم» با حال. در انگلیسی ❌ I live here for 3 years. ✅ I've lived here for 3 years.",
q:[["I ___ him last week.",["have seen","saw"],1,"last week زمان مشخص ← گذشته‌ی ساده."],["I've lived here ___ 2019.",["for","since"],1,"نقطه‌ی شروع ← since."],["She ___ in Paris for three years, but now she lives in Rome.",["has lived","lived"],1,"دیگر آنجا نیست ← گذشته‌ی ساده."]]},

{lv:"b1",id:"ppc",en:"Present perfect continuous",fa:"حال کامل استمراری",
i:"have / has been + ing. برای کاری که از گذشته شروع شده و تا الان ادامه داشته، با تأکید روی «مدت». همچنین برای کاری که تازه تمام شده و اثرش پیداست.",
f:[["ساختار","have/has been + verb-ing"],["مدت","I've been waiting for an hour."],["اثر قابل‌دیدن","Your eyes are red. Have you been crying?"]],
u:["تأکید روی مدت ← استمراری · تأکید روی نتیجه یا تعداد ← حال کامل ساده","I've been writing emails all morning. / I've written 10 emails."],
x:[["I've been studying for two hours.","دو ساعت است دارم درس می‌خوانم."],["It has been raining since morning.","از صبح دارد باران می‌آید."],["Why are you out of breath? — I've been running.","چرا نفس‌نفس می‌زنی؟ — داشتم می‌دویدم."]],
t:"با فعل‌های حالتی استمراری نساز: ❌ I've been knowing him. ✅ I've known him.",
q:[["I ___ for two hours and I'm tired.",["have been studying","studied"],0,"تا الان ادامه داشته + اثرش (خستگی)."],["Your eyes are red. ___ you been crying?",["Have","Did","Are"],0,"have been + ing."],["I've ___ him for years.",["been knowing","known"],1,"know فعل حالتی است."]]},

{lv:"b1",id:"used",en:"Used to / be used to / get used to",fa:"used to و be used to",
i:"سه ساختار شبیه با معناهای متفاوت. used to + فعل ساده = «قبلاً… می‌کردم ولی دیگر نه». be used to + ing = «عادت دارم». get used to + ing = «دارم عادت می‌کنم».",
f:[["عادت گذشته","used to + verb: I used to smoke."],["عادت داشتن","be used to + noun/-ing: I'm used to working late."],["عادت کردن","get used to + noun/-ing: You'll get used to it."],["منفی / سؤالی","didn't use to · Did you use to…?"]],
u:["used to فقط برای گذشته است؛ برای عادت حال از present simple استفاده کن."],
x:[["I used to play football, but now I don't.","قبلاً فوتبال بازی می‌کردم، ولی الان نه."],["She's used to waking up early.","او به زود بیدار شدن عادت دارد."],["I'm getting used to the new job.","دارم به کار جدید عادت می‌کنم."],["Did you use to live here?","قبلاً اینجا زندگی می‌کردی؟"]],
t:"بعد از be used to حرف اضافه‌ی to است نه to مصدری: ❌ I'm used to wake up. ✅ I'm used to waking up.",
q:[["I ___ play football, but now I don't.",["used to","am used to"],0,"عادت گذشته ← used to."],["She's used to ___ early.",["wake up","waking up"],1,"be used to + ing."],["Did you ___ live here?",["used to","use to"],1,"بعد از did شکل ساده: use to."]]},

{lv:"b1",id:"cond1",en:"Zero & first conditional",fa:"شرطی صفر و نوع اول",
i:"شرطی صفر برای حقیقت‌های همیشگی: اگر X، همیشه Y. شرطی نوع اول برای اتفاق‌های واقعی و ممکن در آینده. نکته‌ی مهم: بعد از if از will استفاده نمی‌کنیم.",
f:[["صفر","If + present, present: If you heat ice, it melts."],["نوع اول","If + present, will + verb"],["unless","= if … not: Unless you hurry, you'll miss it."],["جای جمله","Will + … if … (بدون کاما)"]],
u:["صفر: قوانین علمی و عادت‌ها","نوع اول: موقعیت واقعی آینده، تهدید، قول"],
x:[["If it rains tomorrow, we'll stay home.","اگر فردا باران بیاید خانه می‌مانیم."],["If you heat ice, it melts.","اگر یخ را گرم کنی ذوب می‌شود."],["Unless you hurry, you'll miss the bus.","اگر عجله نکنی به اتوبوس نمی‌رسی."],["I'll call you if I have time.","اگر وقت داشتم بهت زنگ می‌زنم."]],
t:"فارسی می‌گوید «اگر بیاید»، انگلیسی هم حال ساده: ❌ If it will rain ✅ If it rains.",
q:[["If it ___ tomorrow, we'll stay home.",["will rain","rains"],1,"بعد از if حال ساده."],["If you heat ice, it ___.",["melts","will melted"],0,"حقیقت علمی ← شرطی صفر."],["Unless you hurry, you ___ the bus.",["will miss","miss"],0,"نتیجه‌ی آینده ← will."]]},

{lv:"b1",id:"cond2",en:"Second conditional",fa:"شرطی نوع دوم (غیرواقعی حال)",
i:"برای موقعیت خیالی یا بعید در حال و آینده. فعل بعد از if گذشته است ولی معنایش گذشته نیست. برای همه‌ی فاعل‌ها می‌شود were گفت.",
f:[["ساختار","If + past simple, would + verb"],["be","If I were you… · If she were here…"],["نصیحت","If I were you, I would…"]],
u:["خیال: If I won the lottery, I'd buy a house.","بعید: If he called me, I'd be surprised."],
x:[["If I were rich, I would travel the world.","اگر پولدار بودم دور دنیا سفر می‌کردم."],["What would you do if you won the lottery?","اگر لاتاری می‌بردی چکار می‌کردی؟"],["If I were you, I'd apologize.","جای تو بودم عذرخواهی می‌کردم."],["I wouldn't do that if I were you.","جای تو بودم این کار را نمی‌کردم."]],
t:"would را در قسمت if نیاور: ❌ If I would have money… ✅ If I had money…",
q:[["If I ___ rich, I would travel.",["am","were"],1,"شرطی دوم ← were."],["What would you do if you ___ the lottery?",["won","win"],0,"بعد از if گذشته‌ی ساده."],["If I were you, I ___ apologize.",["will","would"],1,"نتیجه ← would."]]},

{lv:"b1",id:"pass1",en:"The passive (present & past)",fa:"مجهول (حال و گذشته)",
i:"وقتی خود کار یا چیزی که روی آن کار انجام شده مهم‌تر از انجام‌دهنده است. ساختار: to be + اسم مفعول. انجام‌دهنده اگر مهم باشد با by می‌آید.",
f:[["حال ساده","am/is/are + p.p: English is spoken here."],["گذشته‌ی ساده","was/were + p.p: The bridge was built in 1990."],["با فاعل","The book was written by Hafez."]],
u:["اخبار و متن علمی و رسمی: Two people were injured.","وقتی انجام‌دهنده معلوم نیست: My bike was stolen."],
x:[["English is spoken all over the world.","در سراسر دنیا انگلیسی صحبت می‌شود."],["My phone was stolen yesterday.","دیروز گوشی‌ام دزدیده شد."],["These cars are made in Germany.","این ماشین‌ها در آلمان ساخته می‌شوند."],["The Shahnameh was written by Ferdowsi.","شاهنامه را فردوسی نوشت."]],
t:"be را فراموش نکن: ❌ The bridge built in 1990. ✅ The bridge was built in 1990.",
q:[["English ___ all over the world.",["speaks","is spoken"],1,"زبان صحبت نمی‌کند، صحبت می‌شود ← مجهول."],["The bridge ___ in 1990.",["built","was built"],1,"مجهول گذشته: was + p.p."],["These phones ___ in China.",["are made","are make"],0,"be + اسم مفعول (made)."]]},

{lv:"b1",id:"ger",en:"Gerund or infinitive?",fa:"ing یا to؟ (اسم مصدر و مصدر)",
i:"بعضی فعل‌ها پشتشان ing می‌آید و بعضی to + فعل. این را باید حفظ کرد، ولی چند قانون کمک می‌کند. بعد از حرف اضافه همیشه ing می‌آید.",
f:[["+ ing","enjoy · avoid · finish · mind · suggest · keep · practise"],["+ to","want · decide · hope · plan · need · promise · refuse · learn"],["حرف اضافه + ing","interested in learning · good at drawing · before leaving"],["معنا عوض می‌شود","stop / remember / forget / try"]],
u:["stop smoking = سیگار را ترک کردن · stop to smoke = ایستادن برای سیگار کشیدن","remember locking = یادم هست قفل کردم · remember to lock = یادت باشد قفل کنی"],
x:[["I enjoy reading before bed.","از کتاب خواندن قبل از خواب لذت می‌برم."],["She decided to take the job.","تصمیم گرفت کار را قبول کند."],["I'm interested in learning Japanese.","به یادگیری ژاپنی علاقه دارم."],["Remember to lock the door.","یادت باشه در را قفل کنی."],["He stopped smoking last year.","پارسال سیگار را ترک کرد."]],
t:"look forward to هم حرف اضافه دارد: ❌ I look forward to see you. ✅ I look forward to seeing you.",
q:[["I enjoy ___.",["to read","reading"],1,"enjoy + ing."],["She decided ___ a job.",["to take","taking"],0,"decide + to."],["I'm interested in ___ Japanese.",["learn","learning"],1,"بعد از حرف اضافه ← ing."],["I stopped ___. (سیگار را ترک کردم)",["to smoke","smoking"],1,"stop + ing = دیگر انجام ندادن."]]},

{lv:"b1",id:"rel1",en:"Relative clauses (defining)",fa:"جمله‌واره‌ی موصولی (توصیفی)",
i:"برای اینکه بگوییم دقیقاً درباره‌ی چه کسی یا چه چیزی حرف می‌زنیم. معادل «که» در فارسی است ولی کلمه‌اش بسته به اسم فرق می‌کند.",
f:[["آدم","who / that"],["چیز","which / that"],["مالکیت","whose"],["مکان / زمان","where / when"],["حذف","وقتی مفعول است: The book (that) I bought…"]],
u:["The man who lives next door…","The phone that I bought…","The girl whose bag was stolen…"],
x:[["The man who lives next door is a doctor.","مردی که همسایه‌ی ماست دکتر است."],["This is the book (that) I told you about.","این همان کتابی است که برایت گفتم."],["That's the house where I was born.","آن خانه‌ای است که در آن به دنیا آمدم."],["I met a girl whose father is a pilot.","با دختری آشنا شدم که پدرش خلبان است."]],
t:"ضمیر را تکرار نکن (این در فارسی رایج است): ❌ The book that I read it… ✅ The book that I read…",
q:[["The man ___ lives next door is a doctor.",["which","who"],1,"برای آدم ← who."],["That's the house ___ I was born.",["which","where"],1,"مکان ← where."],["I know a girl ___ father is a pilot.",["who","whose"],1,"مالکیت ← whose."]]},

{lv:"b1",id:"modp",en:"Modals of possibility (present)",fa:"حدس و احتمال در حال: must / might / can't",
i:"وقتی درباره‌ی حال حدس می‌زنیم: must یعنی «حتماً» (تقریباً مطمئن)، might / may / could یعنی «شاید»، can't یعنی «امکان ندارد».",
f:[["مطمئن (+)","must + verb: He must be tired."],["شاید","might / may / could + verb"],["مطمئن (−)","can't + verb: That can't be true."]],
u:["برعکس must در حدس، mustn't نیست؛ can't است."],
x:[["He worked all night. He must be tired.","کل شب کار کرده. حتماً خسته است."],["She isn't answering. She might be asleep.","جواب نمی‌دهد. شاید خواب باشد."],["That can't be Ali — he's in London.","این نمی‌تواند علی باشد؛ لندن است."]],
t:"❌ He mustn't be at home. (برای حدس منفی) ✅ He can't be at home.",
q:[["He's not answering. He ___ be asleep.",["might","can"],0,"احتمال ← might."],["That ___ be John — he's in London.",["mustn't","can't"],1,"حدس منفی قطعی ← can't."],["You've been travelling all day. You ___ be exhausted.",["must","can't"],0,"تقریباً مطمئنیم ← must."]]},

{lv:"b1",id:"rep1",en:"Reported speech (statements)",fa:"نقل قول غیرمستقیم (جمله‌ی خبری)",
i:"وقتی حرف کسی را غیرمستقیم نقل می‌کنیم، معمولاً زمان فعل یک قدم به عقب می‌رود و ضمیرها و کلمات زمانی هم عوض می‌شوند. say بدون مفعول، tell با مفعول (به کسی).",
f:[["عقب‌گرد زمان","am/is → was · do → did · will → would · can → could · did/have done → had done"],["say / tell","He said (that)… · He told me (that)…"],["کلمات زمانی","today → that day · tomorrow → the next day · here → there"]],
u:["«I'm tired.» → She said she was tired.","«I will call you.» → He said he would call me."],
x:[["\"I'm tired.\" → She said she was tired.","گفت خسته است."],["\"I'll help you.\" → He told me he would help me.","به من گفت کمکم می‌کند."],["\"I can't swim.\" → She said she couldn't swim.","گفت شنا بلد نیست."]],
t:"❌ He said me… ✅ He told me… / He said to me…",
q:[["\"I'm tired.\" → She said she ___ tired.",["is","was"],1,"عقب‌گرد زمان: is → was."],["He ___ me that he was busy.",["said","told"],1,"با مفعول (me) ← told."],["\"I will come.\" → He said he ___ come.",["will","would"],1,"will → would."]]},

{lv:"b1",id:"too",en:"Too / enough · so / such",fa:"too و enough · so و such",
i:"too یعنی «بیش از حد» (معمولاً منفی) و قبل از صفت می‌آید. enough یعنی «به اندازه‌ی کافی» و بعد از صفت ولی قبل از اسم می‌آید. so قبل از صفت تنها، such قبل از (صفت +) اسم.",
f:[["too","too + adj: It's too hot to drink."],["enough","adj + enough · enough + noun"],["so","so + adj: It was so good."],["such","such + (a) + adj + noun: It was such a good film."]],
u:["so/such … that: It was so cold that we stayed in."],
x:[["The coffee is too hot to drink.","قهوه داغ‌تر از آن است که بشود خورد."],["He isn't old enough to drive.","هنوز به سن رانندگی نرسیده."],["We don't have enough time.","وقت کافی نداریم."],["It was such a good film!","چه فیلم خوبی بود!"]],
t:"❌ enough old ✅ old enough. — ❌ so a good film ✅ such a good film.",
q:[["He isn't old ___ to drive.",["enough","too"],0,"صفت + enough."],["It was ___ a good film.",["so","such"],1,"قبل از a + اسم ← such."],["This bag is ___ heavy for me to carry.",["too","enough"],0,"بیش از حد ← too."]]},

/* ================= B2 ================= */
{lv:"b2",id:"pastp",en:"Past perfect",fa:"گذشته‌ی کامل (ماضی بعید)",
i:"had + اسم مفعول. وقتی دو کار در گذشته داریم و می‌خواهیم بگوییم کدام زودتر اتفاق افتاده بود. معادل فارسی: «رفته بود».",
f:[["ساختار","had + p.p (برای همه‌ی فاعل‌ها)"],["نشانه‌ها","already · by the time · before · after · when"],["استمراری","had been + -ing (مدت قبل از یک لحظه‌ی گذشته)"]],
u:["When I arrived, the train had already left.","By the time we got there, the film had started."],
x:[["When I arrived, the train had already left.","وقتی رسیدم، قطار رفته بود."],["She was upset because she had lost her keys.","ناراحت بود چون کلیدهایش را گم کرده بود."],["I had never seen the sea before that trip.","قبل از آن سفر هیچ‌وقت دریا را ندیده بودم."]],
t:"اگر ترتیب با after / before معلوم است، گذشته‌ی ساده هم کافی است. ولی وقتی ترتیب مبهم است past perfect لازم است.",
q:[["When I arrived, the train ___ already ___.",["has … left","had … left"],1,"کار زودتر در گذشته ← had left."],["She was upset because she ___ her keys.",["had lost","has lost"],0,"زودتر از ناراحت شدن ← past perfect."]]},

{lv:"b2",id:"cond3",en:"Third conditional",fa:"شرطی نوع سوم (غیرواقعی گذشته)",
i:"برای حسرت و تصور درباره‌ی گذشته‌ای که اتفاق نیفتاد و دیگر قابل تغییر نیست.",
f:[["ساختار","If + had + p.p, would have + p.p"],["مخفف","If I'd known, I'd have come."],["احتمال","could have / might have + p.p"]],
u:["If I had studied, I would have passed. (درس نخواندم و قبول نشدم)"],
x:[["If I had studied harder, I would have passed.","اگر بیشتر درس خوانده بودم قبول می‌شدم."],["If she had left earlier, she wouldn't have missed the flight.","اگر زودتر راه افتاده بود پرواز را از دست نمی‌داد."],["We might have won if Ali had played.","اگر علی بازی کرده بود شاید می‌بردیم."]],
t:"would have را در قسمت if نیاور: ❌ If I would have known… ✅ If I had known…",
q:[["If I had studied, I ___ the exam.",["would pass","would have passed"],1,"نتیجه‌ی گذشته ← would have + p.p."],["If she ___ earlier, she wouldn't have missed it.",["left","had left"],1,"شرط گذشته ← had + p.p."]]},

{lv:"b2",id:"mixed",en:"Mixed conditionals",fa:"شرطی‌های ترکیبی",
i:"وقتی شرط و نتیجه در دو زمان متفاوت هستند. حالت رایج: شرط در گذشته، نتیجه در حال. یا: یک ویژگی همیشگی (حال)، نتیجه در گذشته.",
f:[["گذشته ← حال","If + had + p.p, would + verb (now)"],["حال ← گذشته","If + past simple, would have + p.p"]],
u:["If I had taken that job, I would be in London now.","If she weren't so shy, she would have spoken to him."],
x:[["If I had taken that job, I would be in London now.","اگر آن کار را قبول کرده بودم الان لندن بودم."],["If you hadn't helped me, I wouldn't be here today.","اگر کمکم نکرده بودی امروز اینجا نبودم."],["If she weren't so shy, she would have gone to the party.","اگر این‌قدر خجالتی نبود به مهمانی رفته بود."]],
t:"به کلمه‌های زمانی نگاه کن: now / today ← نتیجه‌ی حال (would + verb).",
q:[["If I had taken the job, I ___ in London now.",["would be","would have been"],0,"now ← نتیجه‌ی حال."],["If she weren't so shy, she ___ to the party last night.",["would go","would have gone"],1,"last night ← نتیجه‌ی گذشته."]]},

{lv:"b2",id:"futp",en:"Future continuous & future perfect",fa:"آینده‌ی استمراری و آینده‌ی کامل",
i:"آینده‌ی استمراری: کاری که در یک لحظه‌ی مشخص آینده در جریان است. آینده‌ی کامل: کاری که تا یک زمان مشخص در آینده تمام شده است.",
f:[["آینده‌ی استمراری","will be + verb-ing"],["آینده‌ی کامل","will have + p.p"],["نشانه‌ی آینده‌ی کامل","by + زمان: by 2030, by Friday, by then"]],
u:["This time tomorrow I'll be flying to Mashhad.","By the end of the year, I'll have saved enough."],
x:[["This time tomorrow, I'll be lying on a beach.","فردا همین موقع روی ساحل دراز کشیده‌ام."],["By 2030, they will have finished the project.","تا ۲۰۳۰ پروژه را تمام کرده‌اند."],["Will you be using the car tonight?","امشب ماشین را لازم داری؟ (پرسش مؤدبانه)"]],
t:"by = «تا (قبل از)» ← معمولاً future perfect. until = «تا (ادامه دارد)».",
q:[["This time tomorrow, I ___ on a beach.",["will lie","will be lying"],1,"در جریان در یک لحظه‌ی آینده."],["By 2030, they ___ the project.",["will finish","will have finished"],1,"by + زمان ← آینده‌ی کامل."]]},

{lv:"b2",id:"pass2",en:"Advanced passive",fa:"مجهول پیشرفته",
i:"مجهول در همه‌ی زمان‌ها ساخته می‌شود: فقط be را در آن زمان صرف کن و p.p بگذار. همچنین ساختارهای خبری مثل It is said that و He is believed to.",
f:[["حال استمراری","is being + p.p"],["حال کامل","has been + p.p"],["مُدال","must / can / should + be + p.p"],["آینده","will be + p.p"],["گزارشی","It is said that… · He is said to be…"]],

{lv:"b2",id:"link",en:"Contrast linkers: although, despite, however",fa:"کلمات ربط تضاد: although / despite / however",

{lv:"c1",id:"inv",en:"Inversion",fa:"وارونگی (Inversion)",

f:[["Never / Rarely","Never have I seen…"],["Not only","Not only did he lie, but he also…"],["Hardly / No sooner","Hardly had I sat down when… · No sooner had I… than…"],["Only","Only then did I realise…"],["Little","Little did she know…"],["شرطی","Should you need… = If you need… · Had I known… = If I had known…"]],
u:["فقط در نوشتار رسمی، سخنرانی و ادبیات؛ در گفتار روزمره کم است."],
x:[["Never have I seen such a beautiful view.","هرگز چنین منظره‌ی زیبایی ندیده‌ام."],["Not only did he arrive late, but he also forgot the tickets.","نه‌تنها دیر آمد، بلیت‌ها را هم یادش رفت."],["No sooner had we arrived than it started to rain.","تازه رسیده بودیم که باران گرفت."],["Should you need any help, please call me.","اگر کمکی لازم داشتید لطفاً تماس بگیرید."],["Little did she know what was waiting for her.","خبر نداشت چه چیزی در انتظارش است."]],
t:"No sooner با than و Hardly / Scarcely با when جفت می‌شوند.",

{lv:"c1",id:"part",en:"Participle clauses",fa:"جمله‌واره‌های وصفی (ing / p.p / having)",
i:"برای خلاصه و رسمی‌تر کردن جمله، یک جمله‌واره را با ing یا p.p یا having + p.p کوتاه می‌کنیم. شرط مهم: فاعل هر دو قسمت باید یکی باشد.",
f:[["هم‌زمان / علت (معلوم)","Walking home, I saw an accident."],["کار زودتر","Having finished the work, she went home."],["مجهول","Built in 1889, the tower is…"],["بعد از اسم","The man sitting there… · The car parked outside…"]],

{lv:"c1",id:"subj",en:"The subjunctive",fa:"وجه التزامی (Subjunctive)",
i:"بعد از فعل‌ها و صفت‌هایی که توصیه، اصرار یا ضرورت را نشان می‌دهند، در انگلیسی رسمی فعل ساده (بدون s و بدون زمان) می‌آید، حتی برای he و she.",
f:[["فعل‌ها","suggest / insist / recommend / demand / request + that + S + base verb"],["صفت‌ها","It's essential / vital / important / crucial + that + S + base verb"],["منفی","that he not be… · that she not go…"],["بریتانیایی","that he should go (هم درست است)"]],

{lv:"c1",id:"rather",en:"Would rather, had better, it's time",fa:"would rather · had better · it's time",

f:[["ترجیح خود","would rather + verb (than…)"],["ترجیح درباره‌ی دیگری","would rather + sb + past simple"],["هشدار","had better (not) + verb"],["دیر شده","It's (high/about) time + S + past · It's time to + verb"]],

{lv:"c1",id:"emph",en:"Emphatic do & so / neither",fa:"تأکید با do و so / neither",

f:[["تأکید","do / does / did + base verb: I do like it!"],["من هم (+)","So + aux + S: So do I. · So can she."],["من هم نه (−)","Neither / Nor + aux + S: Neither do I."]],

{lv:"c1",id:"advcond",en:"Alternatives to if",fa:"جایگزین‌های if در شرطی‌ها",
i:"در سطح پیشرفته به جای if از کلمات دقیق‌تر استفاده می‌کنیم تا معنای شرط ظریف‌تر شود.",
f:[["provided / providing / as long as","فقط به این شرط که"],["unless","مگر اینکه (= if … not)"],["supposing / suppose","فرض کن که…"],["otherwise","وگرنه"],["but for / without + noun","اگر … نبود"],["in case","محض احتیاط (نه شرط!)"]],

q:[["___ that you pay on time, there's no problem.",["Provided","Unless"],0,"به شرط اینکه ← provided."],["___ your help, I would have failed.",["But for","Except"],0,"اگر … نبود ← but for."],["Take a jacket ___ it gets cold.",["in case","if not"],0,"محض احتیاط ← in case."]]},

{lv:"c2",id:"ellip",en:"Ellipsis & substitution",fa:"حذف و جایگزینی (Ellipsis & Substitution)",
i:"انگلیسی‌زبان‌ها از تکرار خوششان نمی‌آید. در سطح C2 به جای تکرار کل عبارت، یا آن را حذف می‌کنیم (ellipsis) یا با یک کلمه‌ی کوتاه جایگزینش می‌کنیم (so, not, do so, one). همین باعث می‌شود حرفت طبیعی و روان شنیده شود.",

{lv:"c2",id:"nomin",en:"Nominalisation",fa:"اسم‌سازی (Nominalisation) در نوشتار آکادمیک",
i:"در متن علمی، اداری و مقاله به جای فعل و صفت از اسم استفاده می‌کنیم تا جمله فشرده، رسمی و غیرشخصی شود. این ابزار اصلی نوشتن در IELTS Writing و مقاله‌ی دانشگاهی است.",

u:["گفتاری: Because the government acted quickly, fewer people died.","آکادمیک: The government's rapid action led to a reduction in deaths."],
x:[["The rapid growth of cities has caused serious problems.","رشد سریع شهرها مشکلات جدی ایجاد کرده است."],["There has been a significant increase in unemployment.","بیکاری به شکل قابل‌توجهی افزایش یافته است."],["The failure of the project was due to a lack of funding.","شکست پروژه به دلیل کمبود بودجه بود."],["His refusal to cooperate surprised everyone.","امتناع او از همکاری همه را متعجب کرد."]],
t:"زیاده‌روی نکن. جمله‌ای که فقط از اسم ساخته شده سنگین و نامفهوم می‌شود. در هر جمله یکی دو اسم‌سازی کافی است.",
q:[["Prices rose sharply. → There was a sharp ___ in prices.",["rise","rose","rising up"],0,"شکل اسمی: a rise in."],["They decided quickly. → Their quick ___ surprised us.",["decide","decision","deciding of"],1,"اسمِ decide می‌شود decision."],["Which sentence is more academic?",["The project failed because there wasn't enough money.","The failure of the project was due to insufficient funding."],1,"اسم‌سازی و واژه‌ی رسمی (insufficient funding)."]]},

{lv:"c2",id:"hedge",en:"Hedging & distancing",fa:"احتیاط در بیان (Hedging) و فاصله‌گذاری مؤدبانه",
i:"در زبان رسمی و آکادمیک، نظر را با قطعیت صددرصد بیان نمی‌کنیم. با ابزارهای hedging ادعا نرم‌تر و علمی‌تر می‌شود. همچنین با زمان گذشته یا استمراری، درخواست مؤدبانه‌تر و غیرمستقیم‌تر می‌شود.",
f:[["فعل‌ها","seem / appear / tend + to"],["It + …","It would seem / appear that… · It is likely that…"],["مُدال","may / might / could + verb"],["قید","arguably · apparently · presumably · to some extent"],["گزارشی","There is said / thought to be…"],["فاصله‌ی مؤدبانه","I was wondering if… · I was hoping you could…"]],
u:["قطعی: This proves that sugar causes obesity.","با احتیاط: This would seem to suggest that sugar may contribute to obesity."],
x:[["It would appear that the data is incomplete.","به نظر می‌رسد داده‌ها ناقص است."],["People tend to spend more when they're stressed.","آدم‌ها معمولاً وقتی استرس دارند بیشتر خرج می‌کنند."],["This is arguably his best novel.","شاید بشود گفت این بهترین رمان اوست."],["I was wondering if you could send me the file.","می‌خواستم ببینم امکانش هست فایل را برایم بفرستید."]],
t:"در نوشتار آکادمیک کمتر بنویس This proves that… و به جایش بنویس This suggests / indicates that…",

  if(tys.includes("v"))lvs.forEach(lv=>VK.forEach(k=>{const L=V[lv][k];L.forEach((w,i)=>{const o=shuf(L.filter((_,j)=>j!==i)).slice(0,2).map(x=>x[1]);const opts=shuf([w[1],...o]);v.push({t:{lv,fa:VN[k],id:lv+"-"+k},q:[`What does “${w[0]}” mean?`,opts,opts.indexOf(w[1]),"مثال: "+w[2],1],i})})}));
  let sq=[];
  if(tys.includes("s"))lvs.forEach(lv=>SIT.filter(o=>o.id!=="num").forEach(o=>{const L=o.L[lv].w;L.forEach((w,i)=>{const d=shuf(L.filter((_,j)=>j!==i)).slice(0,2).map(x=>x[1]);const opts=shuf([w[1],...d]);sq.push({t:{lv,fa:o.fa,id:"sit-"+lv+"-"+o.id},q:[`What does “${w[0]}” mean?`,opts,opts.indexOf(w[1]),w[2]?"مثال: "+w[2]:w[1],1],i})})}));
  const groups=[g,v,sq].filter(a=>a.length),per=Math.ceil(10/Math.max(1,groups.length));
  const items=shuf(groups.flatMap(a=>shuf(a).slice(0,per))).slice(0,10);
  if(!items.length)return;
  Q={items,n:0,ok:0,miss:[]};renderQ();
}
function renderQ(){
  const it=Q.items[Q.n]; setLvColor(it.t.lv);
  $("#main").innerHTML=`<section class="quizbox"><div class="qprog"><span>سؤال ${faDigits(Q.n+1)} از ${faDigits(Q.items.length)}</span><span><span class="lvtag">${it.t.lv.toUpperCase()}</span> ${rich(it.t.fa)}</span></div>
   ${qHTML(it.q,"quiz")}<div class="foot" style="border:0;margin-top:14px;padding:0"><span style="color:var(--muted)">درست: ${faDigits(Q.ok)}</span><button class="btn primary" id="qnext" hidden>${Q.n===Q.items.length-1?"دیدن نتیجه":"سؤال بعدی ←"}</button></div></section>`;
}
function renderResult(){
  document.documentElement.style.setProperty("--lv","var(--b1)");
  const p=Math.round(Q.ok/Q.items.length*100);
  const msg=p>=90?"عالی! این سطح‌ها را خوب بلدی.":p>=60?"خوبه. اشتباه‌ها را مرور کن.":"اشکالی ندارد؛ درس‌های پایین را یک بار دیگر بخوان.";
  $("#main").innerHTML=`<section class="quizbox"><div class="score">${Q.ok}/${Q.items.length}</div><p style="font-weight:700">${msg}</p>
   ${Q.miss.length?`<h3 style="margin-top:20px">اشتباه‌ها</h3><ul class="miss">${Q.miss.map(m=>`<li><div class="en" style="display:block;text-align:left">${esc(m.q[0])} → <b>${esc(m.q[1][m.q[2]])}</b></div><div style="color:var(--muted);font-size:.9rem">${rich(m.q[3])}</div><button class="link" data-goto="${m.t.id}">برو به درس: ${rich(m.t.fa)}</button></li>`).join("")}</ul>`:""}
   <div class="foot"><button class="btn primary" id="qagain">آزمون دوباره</button><button class="btn" id="qsetup">تغییر سطح‌ها</button></div></section>`;
}

/* ===== wiring ===== */
function renderSit(){
  setLvColor(S.lv);
  const i=Math.max(0,SIT.findIndex(x=>x.id===S.sit)),cur=SIT[i]; S.sit=cur.id; store.set("gl-sit",S.sit);
  const c=cur.L[S.lv], lvn=LV[S.lv].n;
  $("#main").innerHTML=`<div class="grid"><aside class="list" aria-label="موقعیت‌ها"><h2>موقعیت‌ها · ${S.lv.toUpperCase()}</h2><ol>${SIT.map(x=>`<li><button data-s="${x.id}" aria-current="${x.id===cur.id}"><span class="dot cnt">${faDigits(x.L[S.lv].w.length+x.L[S.lv].s.length)}</span><span>${esc(x.fa)}</span></button></li>`).join("")}</ol></aside>
  <article class="lesson" id="lesson">
   <div class="eyebrow"><span class="lvtag">${S.lv.toUpperCase()}</span><span>موقعیت ${faDigits(i+1)} از ${faDigits(SIT.length)} · ${lvn}</span></div>
   <h2>${esc(cur.fa)}</h2><div class="entitle">${esc(cur.en)}</div>
   <p>کلمه‌ها و جمله‌های مهم این موقعیت در سطح ${S.lv.toUpperCase()}. بالا روی پله‌ها سطح را عوض کن تا همین موقعیت را در سطح بالاتر یا پایین‌تر ببینی.</p>
   <div class="vbar"><button class="btn" id="hide" aria-pressed="${hideMean}">${hideMean?"نمایش همه‌ی معنی‌ها":"پنهان کردن معنی‌ها (خودآزمایی)"}</button><span style="color:var(--muted);font-size:.85rem">${hideMean?"اول حدس بزن، بعد روی معنی بزن تا ظاهر شود.":""}</span></div>
   <h3>کلمه‌ها و عبارت‌ها (${faDigits(c.w.length)})</h3>
   <div class="vgrid ${hideMean?"hidemean":""}">${c.w.map(v=>`<div class="vcard"><div class="vh"><span class="vw">${esc(v[0])}</span>${canSpeak?`<button class="say" data-say="${esc(v[0].replace(/ · /g,", "))}" aria-label="پخش تلفظ">${ICON}</button>`:""}</div><button class="vm">${rich(v[1])}</button>${v[2]?`<div class="vx">${esc(v[2])}</div>`:""}</div>`).join("")}</div>
   <h3>جمله‌های مهم (${faDigits(c.s.length)})</h3>
   <ul class="exs ${hideMean?"hidemean":""}">${c.s.map(e=>`<li class="ex">${canSpeak?`<button class="say" data-say="${esc(e[0])}" aria-label="پخش تلفظ">${ICON}</button>`:""}<div class="s"><div class="e">${esc(e[0])}</div><div class="f">${esc(e[1])}</div></div></li>`).join("")}</ul>
   <div class="foot"><span></span><div class="nav"><button class="btn" id="sprev" ${i===0?"disabled":""}>→ قبلی</button><button class="btn" id="snext" ${i===SIT.length-1?"disabled":""}>بعدی ←</button></div></div>
  </article></div>`;
}
function render(){renderStairs();$("#m-learn").setAttribute("aria-pressed",S.mode==="learn");$("#m-sit").setAttribute("aria-pressed",S.mode==="sit");$("#m-quiz").setAttribute("aria-pressed",S.mode==="quiz");S.mode==="learn"?renderLearn():S.mode==="sit"?renderSit():renderQuizSetup()}
function scrollLesson(){const l=$("#lesson");if(l&&window.innerWidth<860)l.scrollIntoView({behavior:"smooth",block:"start"});else window.scrollTo({top:0,behavior:"smooth"})}
function go(id,scroll){const t=T.find(x=>x.id===id);S.mode="learn";S.view="g";S.lv=t.lv;S.id=id;render();if(scroll)scrollLesson()}
function goKey(k){const sm=k.match(/^sit-(a1|a2|b1|b2|c1|c2)-(\w+)$/);if(sm){S.mode="sit";S.lv=sm[1];S.sit=sm[2];render();scrollLesson();return}const m=k.match(/^(a1|a2|b1|b2|c1|c2)-(w|c|i)$/);if(m){S.mode="learn";S.lv=m[1];S.view=m[2];render();scrollLesson()}else go(k,true)}
document.addEventListener("click",e=>{
  const fx=e.target.closest(".hidemean .ex .f"); if(fx){fx.classList.toggle("show");return}
  const b=e.target.closest("button,input"); if(!b)return;
  if(b.matches(".step")){if(S.mode!=="sit"){S.mode="learn";S.view="g"}S.lv=b.dataset.lv;S.id=lvTopics(S.lv)[0].id;render();return}
  if(b.id==="m-sit"){S.mode="sit";render();return}
  if(b.matches(".list button[data-s]")){S.sit=b.dataset.s;render();scrollLesson();return}
  if(b.id==="sprev"||b.id==="snext"){const k=SIT.findIndex(x=>x.id===S.sit)+(b.id==="snext"?1:-1);if(SIT[k]){S.sit=SIT[k].id;render();scrollLesson()}return}
  if(b.matches(".list button[data-v]")){S.view=b.dataset.v;render();scrollLesson();return}
  if(b.id==="hide"){hideMean=!hideMean;store.set("gl-hide",hideMean);render();return}
  if(b.matches(".vm")){if(b.closest(".hidemean"))b.classList.toggle("show");return}
  if(b.id==="m-learn"){S.mode="learn";render();return}
  if(b.id==="m-quiz"){S.mode="quiz";render();return}
  if(b.matches(".list button")){go(b.dataset.id,true);return}
  if(b.matches(".say")){speak(b.dataset.say);return}
  if(b.id==="redo"){render();return}
  if(b.matches(".opts button")){const ok=answer(b);
    if(S.mode==="learn"){const qs=[...document.querySelectorAll(".lesson .q")],done=qs.filter(q=>q.querySelector("button:disabled")),right=done.filter(q=>!q.querySelector(".bad"));const ps=$("#pscore");if(ps)ps.innerHTML=`امتیاز: <b>${faDigits(right.length)}</b> درست از ${faDigits(done.length)} جواب (کل: ${faDigits(qs.length)} سؤال)`+(done.length===qs.length?` · <button class="link" id="redo">دوباره تمرین کن</button>`:"")}if(Q&&S.mode==="quiz"&&b.closest('[data-key="quiz"]')){const it=Q.items[Q.n];if(ok)Q.ok++;else Q.miss.push(it);$("#qnext").hidden=false;$("#qnext").focus()}return}
  if(b.id==="mark"){learned.has(S.id)?learned.delete(S.id):learned.add(S.id);store.set("gl-learned",[...learned]);render();return}
  if(["prev","next","vprev","vnext"].includes(b.id)){const i=SEQ.indexOf(curKey())+(/next/.test(b.id)?1:-1);if(SEQ[i])goKey(SEQ[i]);return}
  if(b.id==="qstart"||b.id==="qagain"){startQuiz();return}
  if(b.id==="qsetup"){renderQuizSetup();return}
  if(b.id==="qnext"){Q.n++;Q.n<Q.items.length?renderQ():renderResult();return}
  if(b.dataset.goto){goKey(b.dataset.goto);return}
});
render();
</script>
</body>
